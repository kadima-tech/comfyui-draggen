[project]
name = "draggen"
description = "Load and use your Draggen.io moodboards directly in ComfyUI."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# Keep in sync with requirements.txt. ComfyUI Manager installs that file;
# the registry reads this list. torch and numpy stay with the ComfyUI install.
dependencies = [
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "Pillow>=13.0.0",
    "aiohttp>=3.14.4",
]
classifiers = [
    # Pillow compositing on the CPU. No CUDA, ROCm, Metal, or other accelerator code.
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/kadima-tech/comfyui-draggen"
# The GitHub wiki is not enabled (it redirects to the repository).
Documentation = "https://github.com/kadima-tech/comfyui-draggen/blob/main/README.md"
"Bug Tracker" = "https://github.com/kadima-tech/comfyui-draggen/issues"

[tool.comfy]
PublisherId = "kadima-tech"
DisplayName = "Draggen"
# docs/local.png and docs/remote.png are wide screenshots, not a square icon.
Icon = ""
includes = []
# First tagged ComfyUI release. It already serves WEB_DIRECTORY and PromptServer routes.
requires-comfyui = ">=0.0.1"

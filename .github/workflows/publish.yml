name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

# Checkout needs contents: read. Publishing uses REGISTRY_ACCESS_TOKEN and
# does not write to GitHub issues or pull requests.
permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'kadima-tech' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install comfy-cli
        # comfy-cli 1.23.0 (PyPI 2026-10-20) plus its dependency set, hash-locked.
        # Releases uploaded after 2026-10-21 are pinned to an older version.
        run: python -m pip install --require-hashes -r .github/requirements/comfy-cli.txt

      - name: Publish custom node
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "${REGISTRY_ACCESS_TOKEN}" ]; then
            echo "REGISTRY_ACCESS_TOKEN is not set" >&2
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "${REGISTRY_ACCESS_TOKEN}"

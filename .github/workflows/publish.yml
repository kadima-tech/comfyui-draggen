name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

# Checkout needs contents: read. Publishing uses REGISTRY_ACCESS_TOKEN and
# does not write to GitHub issues or pull requests.
permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'kadima-tech' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install comfy-cli
        # comfy-cli 1.25.0 (PyPI 2026-11-03) plus its dependency set, hash-locked.
        # Releases uploaded after 2026-11-04 are pinned to an older version.
        run: python -m pip install --require-hashes -r .github/requirements/comfy-cli.txt

      - name: Publish custom node
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "${REGISTRY_ACCESS_TOKEN}" ]; then
            echo "REGISTRY_ACCESS_TOKEN is not set" >&2
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "${REGISTRY_ACCESS_TOKEN}"
